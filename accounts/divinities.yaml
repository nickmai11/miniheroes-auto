# Divinity upgrade targets: <divinity>: <units> (blank = leave it alone). 1 unit = 50 levels (4 -> Lv 200; Nick 2026-11-12).
# Divinities = the 6 badges around the artifact on Hero -> Artifact (2 purple, 2 gold, 2 red).
# Tap a badge -> popup "<kind> Divinity", stat line = the name below ("All " dropped: "All ATK" -> ATK),
# Enhance = +1 level for crystals (one crystal type per badge colour) + gold.
# Names: nextjs-fullstack scripts/upsert-divinities.sql (the red ones), grouped by its kind.

# red (hero-specific)
red:
