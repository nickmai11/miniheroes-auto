# Copy to accounts/<instance-name>.yaml (lowercase).
account:
  name: Example             # how Nick refers to it
  mumu_instance: Example    # instance name in MuMuPlayer (window title)
  enabled: true

safety:
  # Never pay more than this for a single paid sweep. Stop and report if the price is higher.
  max_gem_price_per_sweep: 80

missions:
  land_of_trials:
    # total sweeps per day INCLUDING free attempts (0 = skip).
    # Free attempts are used first; anything above them is paid with gems.
    abandoned_mine: 0
    ancient_battlefield: 0
    mysterious_forest: 0
    moonlight_temple: 0
    gem_mine: 0
